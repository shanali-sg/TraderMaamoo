name: Update Equity Chart

on:
  schedule:
    - cron: '0 20 * * *'  # Run daily at 4 PM EST (after market)
  workflow_dispatch:  # Allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests matplotlib
      
      - name: Run equity tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python update_equity.py
      
      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add equity_chart.png equity_history.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update equity chart [skip ci]"
          git push
